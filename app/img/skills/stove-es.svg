<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-label="Estufa de campamento: solo afuera, a más de 10 pies de la casa, nunca en el garaje o balcón; un adulto se queda"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d2340"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d7382a"/></marker><style>.lb{font:700 13px system-ui,-apple-system,sans-serif;fill:#1d2340;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.sm{font:600 11px system-ui,-apple-system,sans-serif;fill:#1d2340;paint-order:stroke;stroke:#fff;stroke-width:3px}.big{font:800 18px system-ui,-apple-system,sans-serif;fill:#1d2340}.rd{fill:#d7382a}</style></defs><rect x="1" y="1" width="318" height="228" rx="14" fill="#f7f8fc" stroke="#e1e5ef"/><rect x="16" y="40" width="96" height="160" fill="#dfe3ee" stroke="#aab3c8" stroke-width="2"/><rect x="40" y="70" width="40" height="40" fill="#bcd3f5" stroke="#8aa3c8" stroke-width="2"/><rect x="44" y="140" width="34" height="60" fill="#c9b49a"/><text x="64" y="34" class="sm" text-anchor="middle">casa</text><line x1="16" y1="200" x2="304" y2="200" stroke="#cdd3e2" stroke-width="3"/><rect x="226" y="164" width="56" height="30" rx="4" fill="#5d6680"/><rect x="232" y="156" width="44" height="8" rx="3" fill="#2b3147"/><path d="M246 154 q4 -10 0 -18 q8 6 6 18z M260 154 q4 -12 0 -20 q8 8 6 20z" fill="#f2a43a"/><rect x="270" y="176" width="12" height="20" rx="4" fill="#d7382a"/><path d="M118 186 L220 186" stroke="#1d2340" stroke-width="2.5" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="168" y="178" class="lb" text-anchor="middle">10+ pies</text><text x="254" y="92" class="lb" text-anchor="middle">solo afuera</text><text x="254" y="110" class="sm" text-anchor="middle">un adulto</text><text x="254" y="124" class="sm" text-anchor="middle">se queda</text><path d="M144 56 l30 30 M174 56 l-30 30" stroke="#d7382a" stroke-width="5" stroke-linecap="round"/><text x="159" y="106" class="sm" text-anchor="middle">nunca adentro,</text><text x="159" y="120" class="sm" text-anchor="middle">en el garaje</text><text x="159" y="134" class="sm" text-anchor="middle">ni en el balcón</text></svg>