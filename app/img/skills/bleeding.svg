<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-label="Serious bleeding: press hard, pack deep wounds, and on an arm or leg put a tourniquet 2 to 3 inches above the wound, not on a joint; write down the time"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d2340"></path></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d7382a"></path></marker><style>.lb{font:700 13px system-ui,-apple-system,sans-serif;fill:#1d2340;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.sm{font:600 11px system-ui,-apple-system,sans-serif;fill:#1d2340;paint-order:stroke;stroke:#fff;stroke-width:3px}.big{font:800 18px system-ui,-apple-system,sans-serif;fill:#1d2340}.rd{fill:#d7382a}</style></defs><rect x="1" y="1" width="318" height="228" rx="14" fill="#f7f8fc" stroke="#e1e5ef"></rect><path d="M20.0 120.0 L300.0 120.0" fill="none" stroke="#e9c9a8" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"></path><path d="M20.0 120.0 L300.0 120.0" fill="none" stroke="#d9b48f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 0"></path><ellipse cx="300" cy="120" rx="16" ry="20" fill="#e9c9a8"></ellipse><circle cx="150" cy="120" r="7" fill="#d7382a"></circle><path d="M150 127 q-6 14 0 22 q6 -8 0 -22z" fill="#d7382a"></path><rect x="96" y="96" width="12" height="48" rx="3" fill="#1d2340"></rect><rect x="99" y="86" width="6" height="12" fill="#1d2340"></rect><line x1="102" y1="78" x2="102" y2="70" stroke="#1d2340" stroke-width="3"></line><path d="M102 160 L102 172 M150 160 L150 172 M102 166 L150 166" stroke="#1d2340" stroke-width="2" fill="none"></path><text x="126" y="186" class="sm" text-anchor="middle">2–3 inches above</text><circle cx="62" cy="120" r="12" fill="none" stroke="#d7382a" stroke-width="3" stroke-dasharray="4 3"></circle><text x="62" y="92" class="sm" text-anchor="middle">not on</text><text x="62" y="104" class="sm" text-anchor="middle">a joint</text><text x="184" y="52" class="lb" text-anchor="start">1  Press hard</text><text x="182.2" y="70.0" class="lb" text-anchor="start">2  Pack deep wounds</text><text x="184" y="88" class="lb" text-anchor="start">3  Tourniquet</text><text x="102" y="64" class="sm" text-anchor="middle">write the time</text><text x="160" y="216" class="sm" text-anchor="middle">Arm or leg only. Tighten until bleeding stops.</text></svg>