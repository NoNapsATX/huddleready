<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-label="Splint: tie something stiff and padded along the injury so it reaches past the joint above and below; snug, not tight"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d2340"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d7382a"/></marker><style>.lb{font:700 13px system-ui,-apple-system,sans-serif;fill:#1d2340;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.sm{font:600 11px system-ui,-apple-system,sans-serif;fill:#1d2340;paint-order:stroke;stroke:#fff;stroke-width:3px}.big{font:800 18px system-ui,-apple-system,sans-serif;fill:#1d2340}.rd{fill:#d7382a}</style></defs><rect x="1" y="1" width="318" height="228" rx="14" fill="#f7f8fc" stroke="#e1e5ef"/><path d="M30.0 120.0 L250.0 120.0" fill="none" stroke="#e9c9a8" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="262" cy="120" rx="18" ry="20" fill="#e9c9a8"/><rect x="50" y="94" width="190" height="14" rx="6" fill="#b9a27a" stroke="#7d6a48" stroke-width="2"/><text x="145" y="86" class="sm" text-anchor="middle">something stiff, padded</text><rect x="65" y="90" width="10" height="62" rx="3" fill="#3d7be0" opacity=".9"/><rect x="140" y="90" width="10" height="62" rx="3" fill="#3d7be0" opacity=".9"/><rect x="215" y="90" width="10" height="62" rx="3" fill="#3d7be0" opacity=".9"/><circle cx="40" cy="120" r="14" fill="none" stroke="#1d2340" stroke-width="2" stroke-dasharray="4 3"/><circle cx="246" cy="120" r="14" fill="none" stroke="#1d2340" stroke-width="2" stroke-dasharray="4 3"/><text x="40" y="160" class="sm" text-anchor="middle">joint above</text><text x="246" y="160" class="sm" text-anchor="middle">joint below</text><text x="160" y="196" class="sm" text-anchor="middle">Tie snug, not tight. Fingers stay warm and pink.</text></svg>