<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-label="Baño de cubeta: dos bolsas gruesas, una palada de arena para gato después de cada uso, amarrar y guardar afuera"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d2340"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d7382a"/></marker><style>.lb{font:700 13px system-ui,-apple-system,sans-serif;fill:#1d2340;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.sm{font:600 11px system-ui,-apple-system,sans-serif;fill:#1d2340;paint-order:stroke;stroke:#fff;stroke-width:3px}.big{font:800 18px system-ui,-apple-system,sans-serif;fill:#1d2340}.rd{fill:#d7382a}</style></defs><rect x="1" y="1" width="318" height="228" rx="14" fill="#f7f8fc" stroke="#e1e5ef"/><path d="M100 92 h120 l-12 110 q-48 12 -96 0z" fill="#e7ebf5" stroke="#8a95ae" stroke-width="3"/><path d="M94 84 q66 -22 132 0 l-6 14 q-60 -16 -120 0z" fill="#3a4157"/><path d="M96 92 q64 -18 128 0" fill="none" stroke="#596079" stroke-width="2"/><rect x="96" y="80" width="128" height="10" rx="5" fill="#5d6680"/><text x="160" y="72" class="sm" text-anchor="middle">dos bolsas gruesas</text><path d="M250 70 l-22 34 h-16 l4 -10z" fill="#c8b48e" stroke="#8d7a55" stroke-width="2"/><path d="M150 120 q10 -8 22 0 q-4 10 -11 10 q-7 0 -11 -10z" fill="#c8b48e"/><text x="250" y="46" class="sm" text-anchor="middle">palada de</text><text x="250" y="60" class="sm" text-anchor="middle">arena para gato</text><text x="232" y="122" class="sm" text-anchor="start">después</text><text x="232" y="136" class="sm" text-anchor="start">de cada uso</text><text x="160" y="222" class="sm" text-anchor="middle">Cubeta de 5 galones. Amarra, guarda afuera, con tapa.</text></svg>