<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-label="Water-jug lantern: strap a headlamp around a full gallon jug of water with the light facing in"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d2340"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d7382a"/></marker><style>.lb{font:700 13px system-ui,-apple-system,sans-serif;fill:#1d2340;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.sm{font:600 11px system-ui,-apple-system,sans-serif;fill:#1d2340;paint-order:stroke;stroke:#fff;stroke-width:3px}.big{font:800 18px system-ui,-apple-system,sans-serif;fill:#1d2340}.rd{fill:#d7382a}</style></defs><rect x="1" y="1" width="318" height="228" rx="14" fill="#f7f8fc" stroke="#e1e5ef"/><defs><radialGradient id="glow"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".95"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient></defs><circle cx="160" cy="118" r="100" fill="url(#glow)"/><path d="M126 70 h68 q10 0 10 12 v96 q0 12 -12 12 h-64 q-12 0 -12 -12 v-96 q0 -12 10 -12z" fill="#eef5ff" stroke="#9fb3d6" stroke-width="3"/><rect x="146" y="52" width="28" height="20" rx="4" fill="#cfd8ea" stroke="#9fb3d6" stroke-width="2"/><path d="M118 132 h84" stroke="#1d2340" stroke-width="6"/><rect x="146" y="122" width="28" height="20" rx="6" fill="#1d2340"/><circle cx="160" cy="132" r="5" fill="#ffe36b"/><path d="M126 100 h68" stroke="#bcd6ff" stroke-width="2"/><text x="160" y="214" class="sm" text-anchor="middle">water spreads the light</text><text x="214" y="132" class="sm" text-anchor="start">headlamp,</text><text x="214" y="146" class="sm" text-anchor="start">light facing in</text><text x="20" y="96" class="sm" text-anchor="start">gallon jug</text><text x="20" y="110" class="sm" text-anch